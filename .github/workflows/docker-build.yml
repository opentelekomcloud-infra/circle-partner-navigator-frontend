name: Docker Image Build

on:
  pull_request:
    types:
      - opened
      - closed
      - edited
      - reopened
      - synchronize

env:
  PROJECT: circle-partner-navigator-frontend

jobs:

  build:
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-internal
    container:
      image: gcr.io/kaniko-project/executor:v1.24.0-debug

    steps:
    - name: Configure registry credentials
      env:
        ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
        ARTIFACTORY_AUTH_USERNAME: ${{ secrets.ARTIFACTORY_AUTH_USERNAME }}
        ARTIFACTORY_AUTH_PASSWORD: ${{ secrets.ARTIFACTORY_AUTH_PASSWORD }}
      run: |
        mkdir -p /kaniko/.docker
        auth="$(printf '%s:%s' "$ARTIFACTORY_AUTH_USERNAME" "$ARTIFACTORY_AUTH_PASSWORD" | base64 | tr -d '\n')"
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$ARTIFACTORY_URL" "$auth" > /kaniko/.docker/config.json

    - name: Build image with Kaniko
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
        AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        SWR_URL: ${{ secrets.SWR_URL }}
      run: |
        /kaniko/executor \
          --context="git://github.com/${GITHUB_REPOSITORY}.git#${GITHUB_SHA}" \
          --dockerfile=Dockerfile \
          --destination="${SWR_URL}/${PROJECT}:pr-${{ github.event.pull_request.number }}" \
          --no-push \
          --snapshot-mode=time --compressed-caching=false \
          --label="org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
          --label="org.opencontainers.image.revision=${GITHUB_SHA}" \
          --label="org.opencontainers.image.title=${PROJECT}" \
          --build-arg BASE_URL="$BASE_URL" \
          --build-arg ARTIFACTORY_URL="$ARTIFACTORY_URL" \
          --build-arg AUTH_TOKEN="$AUTH_TOKEN"

  push_if_merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-internal
    container:
      image: gcr.io/kaniko-project/executor:v1.24.0-debug

    steps:
      - name: Configure registry credentials
        env:
          SWR_URL: ${{ secrets.SWR_URL }}
          SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
          SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_AUTH_USERNAME: ${{ secrets.ARTIFACTORY_AUTH_USERNAME }}
          ARTIFACTORY_AUTH_PASSWORD: ${{ secrets.ARTIFACTORY_AUTH_PASSWORD }}
        run: |
          mkdir -p /kaniko/.docker
          swr_auth="$(printf '%s:%s' "$SWR_USERNAME" "$SWR_PASSWORD" | base64 | tr -d '\n')"
          art_auth="$(printf '%s:%s' "$ARTIFACTORY_AUTH_USERNAME" "$ARTIFACTORY_AUTH_PASSWORD" | base64 | tr -d '\n')"
          printf '{"auths":{"%s":{"auth":"%s"},"%s":{"auth":"%s"}}}' \
            "$SWR_URL" "$swr_auth" "$ARTIFACTORY_URL" "$art_auth" > /kaniko/.docker/config.json

      - name: Build and push image with Kaniko
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          SWR_URL: ${{ secrets.SWR_URL }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          image="${SWR_URL}/t-cloud-public/${PROJECT}"
          /kaniko/executor \
            --context="git://github.com/${GITHUB_REPOSITORY}.git#${GITHUB_SHA}" \
            --dockerfile=Dockerfile \
            --snapshot-mode=time --compressed-caching=false \
            --destination="${image}:${BASE_REF}" \
            --destination="${image}:pr-${PR_NUMBER}" \
            --destination="${image}:sha-${short_sha}" \
            --label="org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label="org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label="org.opencontainers.image.title=${PROJECT}" \
            --build-arg BASE_URL="$BASE_URL" \
            --build-arg ARTIFACTORY_URL="$ARTIFACTORY_URL" \
            --build-arg AUTH_TOKEN="$AUTH_TOKEN"
